# Compila la app de Windows y la extensión de Chrome, firma el .exe con SignPath
# y publica un Release de GitHub.
#
# Se ejecuta al publicar un Release desde GitHub (con una etiqueta como v1.0.1):
# compila, firma y adjunta los archivos a ese Release. También se puede ejecutar a
# mano desde la pestaña "Actions" (deja los archivos como artefactos, sin Release).
# Mientras SignPath no esté configurado (falta el secreto SIGNPATH_API_TOKEN), el
# flujo igual compila y publica el .exe SIN firmar.

name: Compilar, firmar y publicar

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write   # crear el Release y subir sus archivos
  actions: read     # SignPath descarga el artefacto sin firmar de esta ejecución

jobs:
  build:
    runs-on: windows-latest
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Compilar la app de Windows (un solo .exe)
        shell: pwsh
        working-directory: windows-app
        run: >
          dotnet publish -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none
          -o ${{ github.workspace }}/dist

      - name: Empaquetar la extensión de Chrome
        shell: pwsh
        run: |
          $ver = (Get-Content letras-flotantes/manifest.json -Raw | ConvertFrom-Json).version
          $zip = "dist/letras-flotantes-$ver.zip"
          Push-Location letras-flotantes
          Compress-Archive -Path manifest.json, src, icons -DestinationPath "../$zip" -Force
          Pop-Location
          "EXT_ZIP=$zip" >> $env:GITHUB_ENV

      # SignPath toma el .exe desde un artefacto de esta ejecución.
      - name: Subir el .exe sin firmar
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: FloatingLyrics-sin-firmar
          path: dist/FloatingLyrics.exe
          if-no-files-found: error

      - name: Firmar con SignPath
        if: env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Usar el .exe firmado
        if: env.SIGNPATH_API_TOKEN != ''
        shell: pwsh
        run: |
          $signed = Get-ChildItem signed -Recurse -Filter FloatingLyrics.exe | Select-Object -First 1
          if (-not $signed) { throw 'SignPath no devolvió FloatingLyrics.exe firmado' }
          Copy-Item $signed.FullName dist/FloatingLyrics.exe -Force
          $sig = Get-AuthenticodeSignature dist/FloatingLyrics.exe
          "Firma: $($sig.Status) — $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { throw "La firma no es válida: $($sig.StatusMessage)" }

      - name: Avisar si el .exe va sin firmar
        if: env.SIGNPATH_API_TOKEN == ''
        run: echo "::warning::SignPath no está configurado; el .exe se publica SIN firmar."

      - name: Guardar los archivos de la versión
        uses: actions/upload-artifact@v4
        with:
          name: version
          path: |
            dist/FloatingLyrics.exe
            ${{ env.EXT_ZIP }}

      - name: Adjuntar los archivos al Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            dist/FloatingLyrics.exe
            ${{ env.EXT_ZIP }}
